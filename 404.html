<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030717">
  <meta name="robots" content="noindex,nofollow">
  <title>404 | AH Arcade</title>
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>/* Critical error-page styles in case a host mishandles nested paths. */
    body{margin:0;background:radial-gradient(ellipse at 50% 62%,#1542ba 0%,#081e68 35%,#02050e 80%);color:#f8faff;font-family:'Courier New',monospace}
    .error-content{text-align:center;max-width:90vw;margin:auto}
    .error-content h1{font-weight:900;font-size:clamp(60px,15vw,155px);color:#ffd535;text-shadow:5px 5px #cb356f,-3px -3px #69dfff;line-height:1;margin:0 0 30px}
    .error-content p{font-weight:900;letter-spacing:.1em;margin:0 0 44px}
    .error-content a{color:white;text-decoration:none;font-weight:900;letter-spacing:.1em;display:inline-block;padding:12px}
    .error-content a:hover,.error-content a:focus-visible{color:#ffd535}
  </style>
</head>
<body class="error-page">
  <canvas class="stars" id="stars" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <main class="error-main">
    <div class="error-content">
      <h1>404</h1>
      <p>GAME NOT FOUND</p>
      <a href="/">PRESS START TO RETURN</a>
    </div>
  </main>
  <script src="/assets/js/app.js" defer></script>
</body>
</html>
